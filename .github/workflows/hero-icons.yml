# Портреты героев для карты матча кладём на свой сайт: у части игроков CDN Steam в Телеграме не открывается.
# Запуск руками после выхода нового героя: Actions -> «Портреты героев».
name: Портреты героев

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Скачать и ужать
        run: |
          pip install -q pillow
          python3 tools/fetch-hero-icons.py
      - name: Сохранить
        run: |
          git config user.name "builds-bot"
          git config user.email "builds-bot@users.noreply.github.com"
          git add docs/img/heroes
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -q -m "Портреты героев для карты"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
