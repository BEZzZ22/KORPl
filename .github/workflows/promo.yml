# Автопостинг в Телеграм-канал: раз в час берёт из promo/queue.json посты, чьё время пришло, и шлёт их ботом.
# Секреты репозитория: BOT_TOKEN (токен бота, он же в воркере) и PROMO_CHAT (@канал или id; бот — админ канала).
# Без них прогон ничего не делает. Что уже ушло, записывается в promo/posted.json.
name: Автопостинг

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promo
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Постим то, что пора
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROMO_CHAT: ${{ secrets.PROMO_CHAT }}
        run: node tools/promo-post.mjs
      - name: Сохранить, что вышло
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add promo/posted.json
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -q -m "Автопостинг: что вышло"
          git push -q
