# Диагностика разбора реплеев OpenDota (временная)
name: Проверка разбора реплеев
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ajlcd0]
    paths: [".github/workflows/parse-check.yml", "tools/parse-check.mjs"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/parse-check.mjs 801280038
