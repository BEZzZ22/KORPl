# Новый токен YouTube одной кнопкой, без Python на компьютере. Инструкция в tools/yt_code.py.
name: "YouTube: новый токен"

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Адрес страницы http://localhost/?code=... целиком"
        required: true

permissions:
  contents: write

concurrency:
  group: yt
  cancel-in-progress: false

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Меняем код на токен
        env:
          YT_CODE: ${{ inputs.code }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          PROMO_TOKEN_KEY: ${{ secrets.PROMO_TOKEN_KEY }}
        run: |
          pip install -q requests cryptography
          python tools/yt_code.py
      - name: Сохранить токен
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add promo/tokens/yt.enc
          git commit -q -m "YouTube: новый токен"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
