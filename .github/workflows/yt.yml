# Shorts на YouTube по расписанию из promo/yt_queue.json (официальный YouTube Data API v3).
# Секреты репозитория: YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN. Без них прогон ничего не делает.
# Пока проект Google не прошёл аудит YouTube API, загруженные видео приватные: открывай их в YouTube Studio.
name: YouTube Shorts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Загружаем то, что пора
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -n "$YT_REFRESH_TOKEN" ]; then pip install -q google-api-python-client google-auth requests; fi
          python tools/promo_yt.py
      - name: Сохранить, что вышло
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add -A promo/yt_posted.json
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -q -m "YouTube: что загружено"
          git push -q
