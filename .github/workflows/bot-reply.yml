# Ответ юзеру от имени бота по нику (по просьбе владельца). id ищется в базе воркера (D1) и в лог не печатается.
# Токен бота есть только у воркера: кладём в D1 reply_job {to, text}, крон воркера (раз в 3 минуты) шлёт и пишет reply_stat (worker/broadcast.js).
name: Ответ от бота

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Ник в Телеграме без @"
        required: true
      text:
        description: "Текст ответа"
        required: true

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WHO: ${{ inputs.username }}
      TEXT: ${{ inputs.text }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Отправка
        run: |
          npx --yes wrangler@4 d1 execute dotacoach --remote --json --command "SELECT k AS name, meta FROM kv WHERE k LIKE 'seen:%'" 2>/dev/null > seen.json
          id=$(python3 -c 'import json,os; w=os.environ["WHO"].lstrip("@").lower(); rows=json.load(open("seen.json"))[0]["results"]; print(next((r["name"][5:] for r in rows if (json.loads(r.get("meta") or "{}")).get("u","").lower()==w), ""))')
          [ -z "$id" ] && { echo "Ник не найден среди seen:"; exit 1; }
          case "$id" in *[!0-9]*) echo "Странный id"; exit 1 ;; esac
          d1() { npx --yes wrangler@4 d1 execute dotacoach --remote --json "$@" 2>/dev/null; }
          ID="$id" python3 - > job.sql <<'PY'
          import json, os
          v = json.dumps({"to": os.environ["ID"], "text": os.environ["TEXT"]}, ensure_ascii=False).replace("'", "''")
          print("DELETE FROM kv WHERE k = 'reply_stat';")
          print(f"INSERT OR REPLACE INTO kv (k, v, meta, exp) VALUES ('reply_job', '{v}', NULL, NULL);")
          PY
          d1 --file job.sql > /dev/null
          echo "Заявка лежит, ждём крон"
          for i in $(seq 1 30); do
            sleep 15
            st=$(d1 --command "SELECT v FROM kv WHERE k = 'reply_stat'" | python3 -c 'import json,sys; r=json.load(sys.stdin)[0]["results"]; print(r[0]["v"] if r else "")' 2>/dev/null || true)
            [ -n "$st" ] && { printf '%s' "$st" | python3 -c 'import json,sys; ok=json.load(sys.stdin).get("ok"); print("Отправлено" if ok else "Не ушло: человек, похоже, остановил бота"); sys.exit(0 if ok else 1)'; exit $?; }
          done
          echo "Не дождались крона"; exit 1
