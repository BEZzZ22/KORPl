# Ответ юзеру от имени бота по нику (по просьбе владельца). id ищется в базе воркера (D1) и в лог не печатается.
name: Ответ от бота

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Ник в Телеграме без @"
        required: true
      text:
        description: "Текст ответа"
        required: true

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WHO: ${{ inputs.username }}
      TEXT: ${{ inputs.text }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Отправка
        run: |
          npx --yes wrangler@4 d1 execute dotacoach --remote --json --command "SELECT k AS name, meta FROM kv WHERE k LIKE 'seen:%'" 2>/dev/null > seen.json
          id=$(python3 -c 'import json,os; w=os.environ["WHO"].lstrip("@").lower(); rows=json.load(open("seen.json"))[0]["results"]; print(next((r["name"][5:] for r in rows if (json.loads(r.get("meta") or "{}")).get("u","").lower()==w), ""))')
          [ -z "$id" ] && { echo "Ник не найден среди seen:"; exit 1; }
          case "$id" in *[!0-9]*) echo "Странный id"; exit 1 ;; esac
          ID="$id" python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"chat_id": int(os.environ["ID"]), "text": os.environ["TEXT"]}).encode()
          req = urllib.request.Request(f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage", body, {"Content-Type": "application/json"})
          try:
              ok = json.load(urllib.request.urlopen(req, timeout=20)).get("ok")
          except Exception as e:
              ok = False
              print("Ошибка:", getattr(e, "code", type(e).__name__))
          print("Отправлено" if ok else "Не ушло")
          raise SystemExit(0 if ok else 1)
          PY
