# Сырые данные реплея для видеоразбора (служебный, для разработки и отладки).
# Качает реплей, гонит через парсер OpenDota и кладёт полный вывод (gzip) и матч OpenDota в ветку video-data: d/<match_id>.*
# Секреты не нужны.
name: Видеоразбор, сырые данные

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: Номер матча
        required: true
  push:
    branches: [claude/project-thread-1w91tq]
    paths: [".github/workflows/video-data.yml"]

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Данные
        env:
          ID: ${{ inputs.match_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$ID" =~ ^[0-9]+$ ]]; then echo "нет номера матча: прогон только регистрирует workflow"; exit 0; fi
          docker run -d --name parser -p 5600:5600 odota/parser
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:5600/healthz && break; sleep 2; done
          curl -sf --max-time 60 "https://api.opendota.com/api/matches/$ID" -o match.json
          url=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("match.json","utf8")).replay_url||"")')
          [ -n "$url" ] || { echo "нет ссылки на реплей"; exit 1; }
          curl -sf --max-time 300 "$url" -o replay.dem
          for layer in 1 2 3; do
            magic=$(head -c 4 replay.dem | od -An -tx1 | tr -d " \n")
            case "$magic" in
              425a68*) bunzip2 -c replay.dem > replay.tmp && mv replay.tmp replay.dem ;;
              28b52ffd) zstd -dqf replay.dem -o replay.tmp && mv replay.tmp replay.dem ;;
              *) break ;;
            esac
          done
          curl -s --max-time 900 -X POST -T - -o parsed.jsonl http://localhost:5600 < replay.dem
          node -e '
            const c = {};
            for (const l of require("fs").readFileSync("parsed.jsonl", "utf8").split("\n")) { try { const t = JSON.parse(l).type; c[t] = (c[t] || 0) + 1; } catch {} }
            console.log(c);
          '
          gzip -9 parsed.jsonl
          ls -la parsed.jsonl.gz match.json
          git init -q out && cd out
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          if git fetch -q --depth=1 origin video-data; then git checkout -q -B video-data FETCH_HEAD; else git checkout -q --orphan video-data; fi
          git config user.name "replay-bot"
          git config user.email "replay-bot@users.noreply.github.com"
          mkdir -p d && cp ../parsed.jsonl.gz "d/$ID.jsonl.gz" && cp ../match.json "d/$ID.match.json"
          git add d && git commit -q -m "Данные реплея" && git push -q origin video-data
