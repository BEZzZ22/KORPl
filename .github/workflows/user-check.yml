# Почему юзер застрял: по нику из отчёта смотрит его счётчики в базе воркера (D1) и что OpenDota отдаёт по привязанному аккаунту.
# Репо публичный, логи видны всем: печатаются только числа и флаги, без имён и id.
name: Проверка юзера

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Ник в Телеграме без @"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NS: ffcbcc863d684737becec7a78f57412f
      WHO: ${{ inputs.username }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка
        run: |
          # с 29.10 данные воркера в D1 (база dotacoach)
          d1() { npx --yes wrangler@4 d1 execute dotacoach --remote --json --command "$1" 2>/dev/null; }
          d1 "SELECT k AS name, meta FROM kv WHERE k LIKE 'seen:%'" > seen.json
          id=$(python3 -c 'import json,os; w=os.environ["WHO"].lstrip("@").lower(); rows=json.load(open("seen.json"))[0]["results"]; print(next((r["name"][5:] for r in rows if (json.loads(r.get("meta") or "{}")).get("u","").lower()==w), ""))')
          [ -z "$id" ] && { echo "Ник не найден среди seen:"; exit 0; }
          case "$id" in *[!0-9]*) echo "Странный id"; exit 1 ;; esac
          echo "Счётчики по дням:"
          d1 "SELECT k AS name, meta FROM kv WHERE k LIKE 'act:%:$id' ORDER BY k" | python3 -c 'import json,sys; [print(" ", r["name"].split(":")[1], r["meta"]) for r in json.load(sys.stdin)[0]["results"]]'
          d1 "SELECT v FROM kv WHERE k = 'user:$id'" | python3 -c 'import json,sys; r=json.load(sys.stdin)[0]["results"]; print(r[0]["v"] if r else "")' > user.json || true
          acc=$(python3 -c 'import json; d=json.load(open("user.json")); print(d.get("account_id") or "")' 2>/dev/null || true)
          echo "Профиль: $([ -s user.json ] && echo есть || echo нет), аккаунт привязан: $([ -n "$acc" ] && echo да || echo нет)"
          python3 -c 'import json; d=json.load(open("user.json")); print("  разборов в истории:", len(d.get("progress") or []), "обновлён:", d.get("updated"))' 2>/dev/null || true
          [ -z "$acc" ] && exit 0
          echo "OpenDota:"
          curl -s --max-time 20 "https://api.opendota.com/api/players/$acc" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("profile") or {}; print("  профиль есть:", bool(p), "| rank_tier:", d.get("rank_tier"), "| плюс:", p.get("plus"), "| последний вход на OpenDota:", p.get("last_login"))'
          curl -s --max-time 20 "https://api.opendota.com/api/players/$acc/recentMatches" | python3 -c 'import json,sys; m=json.load(sys.stdin); print("  недавних матчей:", len(m) if isinstance(m,list) else m, "| последний:", (m[0].get("start_time") if isinstance(m,list) and m else None))'
          curl -s --max-time 20 "https://api.opendota.com/api/players/$acc/wl" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("  всего игр в базе OpenDota:", (d.get("win",0)+d.get("lose",0)))'
