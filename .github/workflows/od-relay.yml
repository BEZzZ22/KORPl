# Выгрузка OpenDota для воркера: карточки в пати-чатах, «реплей разобран», пуш после катки, сводка недели.
# Воркеру OpenDota отвечает 429 (общие IP Cloudflare), раннеру GitHub — 200. Прогон дежурит 5 ч 40 мин и раз в 20 с
# спрашивает воркер GET /relay, что принести (tools/od-relay.mjs, worker/relay.js). В конце запускает себя снова,
# запасные пути — крон раз в 30 минут и сам воркер (workflow_dispatch, если выгрузка молчит).
# Ключ к воркеру выводится из секрета CLOUDFLARE_API_TOKEN (см. worker.yml). В лог — только числа.
name: Выгрузка OpenDota

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: od-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Дежурство
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}   # запуск workflow «Видеоразбор», когда в очереди воркера ждут ролики
        run: node tools/od-relay.mjs
      - name: Следующее дежурство
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run od-relay.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
