# Второй Телеграм-аккаунт для Дота-чатов (tools/tg2.py). Запуск руками с телефона: Actions → «Акк для чатов» → Run workflow.
# 1) action=code — придёт код в Телеграм; 2) action=login + code — вход; 3) action=rules — снять правила чатов (только чтение).
# Секреты: TG_API_ID, TG_API_HASH (те же, что для канала), TG2_PHONE, TG2_PASSWORD (если есть облачный пароль), PROMO_TOKEN_KEY.
name: Акк для чатов

on:
  workflow_dispatch:
    inputs:
      action:
        description: "code — прислать код, login — войти, rules — снять правила чатов, setup — почистить чаты и оформить профиль менеджера"
        type: choice
        options: [code, login, rules, setup, discover, send, inbox, folder, test, join, fix, mute, main_code, main_login, main_whoami, main_qr, main_join, main_post, listen]
        default: code
      code:
        description: "Код из Телеграма (только для login)"
        required: false
      target:
        description: "Чат для main_join / main_post"
        required: false
      pin:
        description: "Закрепить пост (main_post)"
        type: boolean
        default: false
      from:
        description: "С какого акка слать (send): tg2 — Максим, main — основной акк (не больше 5 писем)"
        type: choice
        options: [tg2, main]
        default: tg2

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: tg2-${{ inputs.action == 'listen' && 'listen' || 'run' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.action == 'listen' && 355 || 40 }}
    steps:
      - name: Спрятать код из логов
        env:
          CODE: ${{ inputs.code }}
        run: '[ -n "$CODE" ] && echo "::add-mask::$CODE" || true'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q telethon cryptography
      - name: Запуск
        env:
          ACTION: ${{ inputs.action }}
          CODE: ${{ inputs.code }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG2_PHONE: ${{ secrets.TG2_PHONE }}
          FROM: ${{ inputs.from }}
          TARGET: ${{ inputs.target }}
          PIN: ${{ inputs.pin && '1' || '' }}
          TG_SESSION: ${{ inputs.from == 'main' && secrets.TG_SESSION || '' }}
          TG2_PASSWORD: ${{ secrets.TG2_PASSWORD }}
          PROMO_TOKEN_KEY: ${{ secrets.PROMO_TOKEN_KEY }}
          MAIN_PASSWORD: ${{ inputs.from == 'main' && secrets.MAIN_PASSWORD || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          python tools/tg2.py
      - name: Сохранить
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add -A promo/tokens
          git add -A promo/posts || true
          for f in promo/targets.json promo/outreach.json promo/outreach_sent.json promo/outreach_done.json promo/joined.json; do [ -f $f ] && git add $f; done
          [ -f promo/chats_rules.json ] && git add promo/chats_rules.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Акк для чатов: ${{ inputs.action }}"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep $((i*3)); done
