# Рилсы в Инстаграм по расписанию из promo/ig_queue.json (неофициальный вход по cookie sessionid, риск бана принимает владелец).
# Секрет репозитория IG_SESSIONID: cookie sessionid из браузера, где ты вошёл в Инстаграм. Без него прогон ничего не делает.
# Вручную (Run workflow): action = post (по умолчанию), profile (обновить название, описание, аватарку из promo/ig_profile.json)
# или delete (удалить все рилсы аккаунта и очистить promo/ig_posted.json).
name: Инстаграм рилсы

# Расписание выключено 28.10.2026: Инстаграм режет вход с серверов GitHub (login_required каждый час).
# Запуск только вручную (Run workflow)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "post, profile или delete"
        default: post
        required: true

permissions:
  contents: write

concurrency:
  group: ig
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Выполняем
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ -n "$IG_SESSIONID" ]; then pip install -q instagrapi moviepy pillow; fi
          case "$ACTION" in
            profile) python tools/promo_ig.py --profile ;;
            delete) python tools/promo_ig.py --delete ;;
            *) python tools/promo_ig.py ;;
          esac
      - name: Сохранить, что вышло
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add -A promo/ig_posted.json
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -q -m "Инстаграм: что вышло"
          # пока шёл прогон, автопостинг мог закоммитить своё: без rebase push отбивается и отметка теряется
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
