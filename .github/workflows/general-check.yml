# Генеральная проверка разбора на живых матчах OpenDota: движок, приложение в Chromium, заявка на реплей (Actions → Run workflow)
name: Генеральная проверка разбора
on:
  workflow_dispatch:
    inputs:
      matches:
        description: "Сколько матчей прогнать через движок"
        default: "50"
      ui:
        description: "Сколько прогонов приложения в браузере"
        default: "14"
  push:
    branches: [claude/project-thread-nqvr9g]
    paths: [tools/general-check.mjs, .github/workflows/general-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node tools/general-check.mjs
        env:
          CHECK_MATCHES: ${{ inputs.matches || '50' }}
          CHECK_UI: ${{ inputs.ui || '14' }}
          CHECK_OUT: ${{ runner.temp }}/general
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: ${{ runner.temp }}/general/*.png
          if-no-files-found: ignore
