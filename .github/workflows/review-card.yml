# Разбор матча для админа/автора: открывает мини-апп на живых данных OpenDota, режет скриншоты в карточки и кладёт их в ветку очереди (promo/review/<match>/).
# Отправляет их дежурный через элемент очереди с полем files. Игрок берётся по герою (hero_id), если не задан account.
name: Карточки разбора

on:
  workflow_dispatch:
    inputs:
      match:
        description: "Match ID"
        required: true
      hero_id:
        description: "hero_id игрока (Снайпер = 35); пусто, если задан account"
        default: ""
      account:
        description: "account_id игрока (необязательно)"
        default: ""

permissions:
  contents: write

concurrency:
  group: review-card
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci && npx playwright install --with-deps chromium && pip install -q pillow && sudo apt-get install -y -q fonts-inter
      - name: Заказать парс реплея и подождать до 20 минут
        env:
          MATCH: ${{ inputs.match }}
        run: |
          curl -s -X POST "https://api.opendota.com/api/request/$MATCH" || true
          echo
          for i in $(seq 1 40); do
            v=$(curl -s "https://api.opendota.com/api/matches/$MATCH" | python3 -c "import json,sys;print(json.load(sys.stdin).get('version') or '')" 2>/dev/null || true)
            [ -n "$v" ] && { echo "парс есть, версия $v"; exit 0; }
            sleep 30
          done
          echo "парса пока нет, идём без него"
      - name: Скриншоты и карточки
        env:
          MATCH: ${{ inputs.match }}
          HERO: ${{ inputs.hero_id }}
          ACC: ${{ inputs.account }}
        run: |
          acc="$ACC"
          if [ -z "$acc" ] && [ -n "$HERO" ]; then
            curl -s "https://api.opendota.com/api/matches/$MATCH" -o m.json
            acc=$(python3 -c "import json;m=json.load(open('m.json'));print(next((p.get('account_id') for p in m['players'] if p['hero_id']==$HERO and p.get('account_id')),''))")
          fi
          echo "account=$acc"
          ACCOUNT="$acc" node tools/ui-live.mjs "$MATCH" overview,phases,deaths,build || true
          # без парса реплея вкладок «Фазы» и «Смерти» нет: берём карточки только с тех экранов, что сняты
          shots=$(ls tests/ui/live/$MATCH/*.png | xargs -n1 basename | sed 's/.png//')
          only=""
          for s in $shots; do
            case $s in overview) only="$only,review";; build) only="$only,order,early";; phases) only="$only,phases,lane";; deaths) only="$only,killers,deathmap";; esac
          done
          python tools/promo_images.py "$MATCH" "${only#,}"
          mkdir -p "out/review/$MATCH"
          for n in ${only//,/ }; do cp promo/img/$n.jpg "out/review/$MATCH/"; done
      - name: В ветку очереди
        env:
          MATCH: ${{ inputs.match }}
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git fetch -q origin claude/project-thread-d0uspr
          git checkout -q -B queue origin/claude/project-thread-d0uspr
          mkdir -p "promo/review/$MATCH"
          cp out/review/$MATCH/*.jpg "promo/review/$MATCH/"
          git add promo/review
          git commit -q -m "Карточки разбора $MATCH"
          for i in 1 2 3 4; do git pull -q --rebase origin claude/project-thread-d0uspr && git push -q origin HEAD:claude/project-thread-d0uspr && exit 0; sleep $((i*5)); done
          exit 1
