# Отчёт по пользователям приложения владельцу в Телеграм прямо сейчас (обычно он приходит сам в 09:00 МСК).
# Кладёт в KV воркера заявку report_now, крон воркера (раз в 3 минуты) отправляет отчёт и снимает заявку.
# day — за какой день (ГГГГ-ММ-ДД), пусто — вчера по Москве.
name: Отчёт по юзерам

on:
  workflow_dispatch:
    inputs:
      day:
        description: "День ГГГГ-ММ-ДД (пусто — вчера)"
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Заявка на отчёт
        env:
          DAY: ${{ inputs.day }}
        run: |
          npx --yes wrangler@4 kv key put report_now "${DAY:--}" --namespace-id ffcbcc863d684737becec7a78f57412f --remote
          # крон воркера раз в 3 минуты: ждём, пока заявку снимут, и печатаем итог
          for i in $(seq 1 30); do
            sleep 15
            left=$(npx --yes wrangler@4 kv key get report_now --namespace-id ffcbcc863d684737becec7a78f57412f --remote 2>/dev/null || true)
            if [ -z "$left" ] || echo "$left" | grep -qi "not found"; then break; fi
          done
          echo "Итог:"
          npx --yes wrangler@4 kv key get report_last --namespace-id ffcbcc863d684737becec7a78f57412f --remote
