# Отчёт по пользователям приложения владельцу в Телеграм прямо сейчас (обычно он приходит сам в 09:00 МСК).
# Кладёт в KV воркера заявку report_now, крон воркера (раз в 3 минуты) отправляет отчёт и снимает заявку.
# day — за какой день (ГГГГ-ММ-ДД), пусто — вчера по Москве.
name: Отчёт по юзерам

on:
  workflow_dispatch:
    inputs:
      day:
        description: "День ГГГГ-ММ-ДД (пусто — вчера)"
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # С 29.10 данные воркера в D1 (база dotacoach), см. worker/store.js. Репо публичный: печатаем только числа
      - name: Заявка на отчёт
        env:
          DAY: ${{ inputs.day }}
        run: |
          d1() { npx --yes wrangler@4 d1 execute dotacoach --remote --json --command "$1" 2>/dev/null; }
          start=$(date -u +%Y-%m-%dT%H:%M:%S)
          want="${DAY:--}"
          case "$want" in -|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "День не ГГГГ-ММ-ДД"; exit 1 ;; esac
          d1 "INSERT OR REPLACE INTO kv (k, v, meta, exp) VALUES ('report_now', '$want', NULL, NULL)" > /dev/null
          echo "Состояние D1:"
          d1 "SELECT substr(k, 1, instr(k || ':', ':') - 1) AS p, count(*) AS n FROM kv GROUP BY p ORDER BY p" | python3 -c 'import json,sys; [print(" ", r["p"], r["n"]) for r in json.load(sys.stdin)[0]["results"]]'
          # крон воркера раз в 3 минуты: ждём свежий итог в report_last
          for i in $(seq 1 30); do
            sleep 15
            last=$(d1 "SELECT v FROM kv WHERE k = 'report_last'" | python3 -c 'import json,sys; r=json.load(sys.stdin)[0]["results"]; print(r[0]["v"] if r else "")' 2>/dev/null || true)
            t=$(printf '%s' "$last" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("t",""))' 2>/dev/null || true)
            if [ -n "$t" ] && [[ "$t" > "$start" ]]; then break; fi
          done
          echo "Итог (без имён):"
          printf '%s\n' "$last" | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(l) for l in d.get("text","").splitlines() if l.startswith(("Отчёт","Всего юзеров","Приток","Активных","Что делали"))]; print("отправлено:", d.get("sent"), "ошибок:", len(d.get("errors") or []))'
