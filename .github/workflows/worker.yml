# Деплой воркера тренера в Cloudflare: при изменениях в worker/ и вручную (Actions → «Воркер тренера» → Run workflow).
# Нужны секреты репозитория CLOUDFLARE_API_TOKEN (шаблон «Edit Cloudflare Workers») и CLOUDFLARE_ACCOUNT_ID.
# Ключи самого воркера (CLAUDE_API_KEY, GROQ_API_KEY, GEMINI_API_KEY, GH_TOKEN, BOT_TOKEN, OPENDOTA_KEY, ROBOKASSA_*) можно тоже держать в секретах
# репозитория: заданные перекладываются в воркер, не заданные остаются как были в Cloudflare.
name: Воркер тренера

on:
  push:
    branches: [claude/opus-55-capabilities-limits-ekkxhj]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты воркера
        run: node --test worker/coach.test.mjs worker/coach.chat.test.mjs worker/stats.test.mjs worker/store.test.mjs

      - name: Есть ли доступ к Cloudflare
        id: access
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Нет секрета CLOUDFLARE_API_TOKEN: воркер не задеплоен. Settings → Secrets and variables → Actions."
            echo "ok=" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      # База D1 (бесплатно 100 000 записей в сутки против 1000 у KV). Нет базы — создаём; нет прав у токена
      # (нужно «D1: Edit») — деплоим без неё, воркер работает на KV, как раньше
      - name: База D1
        if: steps.access.outputs.ok
        working-directory: worker
        run: |
          find_id() { npx --yes wrangler@4 d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const db=JSON.parse(s).find(x=>x.name==="dotacoach");console.log(db?db.uuid:"")}catch{console.log("")}})'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx --yes wrangler@4 d1 create dotacoach > /dev/null 2>&1 || true
            id=$(find_id)
          fi
          if [ -n "$id" ]; then
            printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "dotacoach"\ndatabase_id = "%s"\n' "$id" >> wrangler.toml
            echo "D1 подключена"
          else
            echo "::warning::База D1 не создалась (у токена Cloudflare нет прав D1: Edit?). Воркер остаётся на KV."
          fi

      - name: Деплой
        if: steps.access.outputs.ok
        working-directory: worker
        run: npx --yes wrangler@4 deploy -c wrangler.toml

      - name: Ключи воркера из секретов репозитория
        if: steps.access.outputs.ok
        working-directory: worker
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENDOTA_KEY: ${{ secrets.OPENDOTA_KEY }}
          ROBOKASSA_LOGIN: ${{ secrets.ROBOKASSA_LOGIN }}
          ROBOKASSA_PASS1: ${{ secrets.ROBOKASSA_PASS1 }}
          ROBOKASSA_PASS2: ${{ secrets.ROBOKASSA_PASS2 }}
        run: |
          for name in CLAUDE_API_KEY GROQ_API_KEY GEMINI_API_KEY GH_TOKEN BOT_TOKEN OPENDOTA_KEY ROBOKASSA_LOGIN ROBOKASSA_PASS1 ROBOKASSA_PASS2; do
            value="${!name}"
            [ -z "$value" ] && continue
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" -c wrangler.toml > /dev/null
            echo "$name переложен в воркер"
          done

      - name: Воркер отвечает
        if: steps.access.outputs.ok
        run: curl -sf --max-time 30 https://dotacoach.2007rggg.workers.dev/stats > /dev/null && echo "живой"
