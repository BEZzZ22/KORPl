# Разовое: включить инлайн-режим бота через BotFather с основного аккаунта (по просьбе Ярика 08.11)
name: Инлайн-режим бота

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: BotFather /setinline
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          pip install -q telethon
          python tools/botfather_inline.py
