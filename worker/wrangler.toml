name = "dotacoach"
main = "coach.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Telegram id владельца: у него нет суточного лимита вопросов тренеру
[vars]
OWNER_TG_IDS = "6603684388"

# Кэш разборов, расход токенов, подписки на уведомления, карточки
[[kv_namespaces]]
binding = "COACH_KV"
id = "ffcbcc863d684737becec7a78f57412f"

# Раз в 3 минуты проверяем, разобрались ли реплеи, и пишем в Телеграм.
# В 06:00 UTC (09:00 МСК) — отчёт по пользователям владельцу (OWNER_TG_IDS или REPORT_CHAT)
[triggers]
crons = ["*/3 * * * *", "0 6 * * *"]
