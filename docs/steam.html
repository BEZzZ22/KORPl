<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DotaRazbor — вход через Steam</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #08090c; color: #e9e7e2; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 48px 16px; text-align: center; }
    h1 { color: #ecbe60; font-size: 24px; margin: 0 0 8px; }
    p { color: #cfccc5; }
    a.btn { display: inline-block; margin-top: 16px; background: #ecbe60; color: #08090c; border-radius: 12px; padding: 14px 22px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Возвращаю в Телеграм…</h1>
  <p id="text">Аккаунт Steam получен. Если Телеграм не открылся сам, нажми кнопку.</p>
  <a class="btn" id="go" href="https://t.me/DotaRazbor_bot">Открыть разбор в Телеграме</a>
</main>
<script>
  // Возврат из входа через Steam (OpenID). Steam кладёт в адрес claimed_id вида https://steamcommunity.com/openid/id/<steamID64>.
  // Подпись Steam не проверяем: это то же, что ввести Friend ID руками, а к деньгам и чужим данным аккаунт Доты доступа не даёт
  (function () {
    var q = new URLSearchParams(location.search);
    var m = /^https:\/\/steamcommunity\.com\/openid\/id\/(\d{17})$/.exec(q.get("openid.claimed_id") || "");
    var go = document.getElementById("go");
    history.replaceState(null, "", location.pathname);
    if (!m) {
      document.getElementById("title").textContent = q.get("openid.mode") === "cancel" ? "Вход отменён" : "Steam не отдал аккаунт";
      document.getElementById("text").textContent = "Вернись в Телеграм и попробуй ещё раз или привяжи аккаунт по Friend ID.";
      return;
    }
    var url = "https://t.me/DotaRazbor_bot?startapp=l" + m[1];
    go.href = url;
    setTimeout(function () { location.href = url; }, 300);
  })();
</script>
</body>
</html>
