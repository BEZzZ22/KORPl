<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DotaRazbor — код получен</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #08090c; color: #e9e7e2; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    h1 { color: #ecbe60; font-size: 24px; margin: 0 0 8px; }
    textarea { width: 100%; box-sizing: border-box; height: 120px; background: #121319; color: #e9e7e2; border: 1px solid #23222a; border-radius: 8px; padding: 10px; font: 13px/1.4 ui-monospace, monospace; }
    button { margin-top: 10px; background: #ecbe60; color: #08090c; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
    p { color: #cfccc5; }
  </style>
</head>
<body>
<main>
  <h1>Код получен</h1>
  <p>Скопируй адрес ниже целиком и вставь его в окно скрипта на компьютере. Никому больше его не показывай.</p>
  <textarea id="url" readonly></textarea>
  <button id="copy">Скопировать</button>
</main>
<script>
  const box = document.getElementById("url");
  box.value = location.href;
  document.getElementById("copy").onclick = () => { box.select(); navigator.clipboard?.writeText(box.value); };
  history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
